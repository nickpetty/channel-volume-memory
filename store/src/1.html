<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<div class="brand"><img src="../../icons/icon128.png">Channel Volume Memory</div>
<h1>A different volume for <span>every channel</span>.</h1>
<p class="sub">Set it once with the player's own slider. It's remembered automatically.</p>
<div class="cards">
  <div class="card"><span class="chip">Twitch</span><h3>NightOwlPlays</h3>
    <div class="slider"><div class="track"><div class="fill" style="width:35%"></div><div class="knob" style="left:35%"></div></div><div class="pct">35%</div></div></div>
  <div class="card"><span class="chip">YouTube</span><h3>LofiLantern</h3>
    <div class="slider"><div class="track"><div class="fill" style="width:80%"></div><div class="knob" style="left:80%"></div></div><div class="pct">80%</div></div></div>
  <div class="card"><span class="chip">Twitch</span><h3>PixelPorchTV</h3>
    <div class="slider"><div class="track"><div class="fill" style="width:55%"></div><div class="knob" style="left:55%"></div></div><div class="pct">55%</div></div></div>
</div>
